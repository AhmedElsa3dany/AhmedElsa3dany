<svg width="1200" height="310" viewBox="0 0 1200 310" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">A woven journey of impact</title>
  <desc id="desc">Five animated bohemian medallions represent Ahmed's competition, academic, and community milestones.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="310"><stop stop-color="#201611"/><stop offset=".52" stop-color="#302019"/><stop offset="1" stop-color="#17241F"/></linearGradient>
    <linearGradient id="cord" x1="90" y1="0" x2="1110" y2="0"><stop stop-color="#C96F52"/><stop offset=".48" stop-color="#E8C47C"/><stop offset="1" stop-color="#6F9480"/></linearGradient>
    <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#E8C47C" fill-opacity=".06"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="310" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="310" rx="28" fill="url(#grain)"/>
  <text x="600" y="43" text-anchor="middle" fill="#F3E8D0" font-family="Georgia, serif" font-size="25" font-weight="700" letter-spacing="4">A WOVEN JOURNEY OF IMPACT</text>
  <text x="600" y="68" text-anchor="middle" fill="#BDAE95" font-family="Segoe UI, Arial" font-size="11" letter-spacing="3">CURIOSITY · COURAGE · CONSISTENCY · COMMUNITY</text>
  <path d="M97 163C205 102 314 212 428 153C540 96 653 209 769 151C881 96 987 203 1103 143" stroke="url(#cord)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="5s" repeatCount="indefinite"/></path>

  <g transform="translate(106 159)"><circle r="34" fill="#342119" stroke="#C96F52" stroke-width="3"/><circle r="23" fill="none" stroke="#E8C47C" stroke-opacity=".38"/><circle r="6" fill="#E8C47C" filter="url(#glow)"><animate attributeName="r" values="5;7;5" dur="2.4s" repeatCount="indefinite"/></circle><text y="-48" text-anchor="middle" fill="#E8C47C" font-family="Georgia, serif" font-size="22" font-weight="700">#1</text><text y="62" text-anchor="middle" fill="#F3E8D0" font-family="Segoe UI, Arial" font-size="14" font-weight="700">Industry 4.0</text><text y="82" text-anchor="middle" fill="#BDAE95" font-family="Segoe UI, Arial" font-size="12">Marathon</text></g>
  <g transform="translate(347 181)"><circle r="34" fill="#2E271C" stroke="#E8C47C" stroke-width="3"/><circle r="23" fill="none" stroke="#C96F52" stroke-opacity=".45"/><circle r="6" fill="#C96F52" filter="url(#glow)"><animate attributeName="opacity" values=".35;1;.35" dur="2.1s" repeatCount="indefinite"/></circle><text y="-48" text-anchor="middle" fill="#E8C47C" font-family="Georgia, serif" font-size="22" font-weight="700">#1</text><text y="62" text-anchor="middle" fill="#F3E8D0" font-family="Segoe UI, Arial" font-size="14" font-weight="700">Banha</text><text y="82" text-anchor="middle" fill="#BDAE95" font-family="Segoe UI, Arial" font-size="12">Hackathon</text></g>
  <g transform="translate(589 145)"><circle r="36" fill="#263027" stroke="#6F9480" stroke-width="3"/><circle r="24" fill="none" stroke="#AFC5AB" stroke-opacity=".4"/><circle r="7" fill="#AFC5AB" filter="url(#glow)"><animate attributeName="r" values="5;8;5" dur="2.7s" repeatCount="indefinite"/></circle><text y="-50" text-anchor="middle" fill="#AFC5AB" font-family="Georgia, serif" font-size="22" font-weight="700">#3</text><text y="66" text-anchor="middle" fill="#F3E8D0" font-family="Segoe UI, Arial" font-size="14" font-weight="700">Huawei ICT</text><text y="86" text-anchor="middle" fill="#BDAE95" font-family="Segoe UI, Arial" font-size="12">Nationwide</text></g>
  <g transform="translate(831 174)"><circle r="34" fill="#38241C" stroke="#C96F52" stroke-width="3"/><circle r="23" fill="none" stroke="#E8C47C" stroke-opacity=".4"/><circle r="6" fill="#E8C47C" filter="url(#glow)"><animate attributeName="opacity" values="1;.3;1" dur="2.3s" repeatCount="indefinite"/></circle><text y="-48" text-anchor="middle" fill="#E8C47C" font-family="Georgia, serif" font-size="20" font-weight="700">TOP 5</text><text y="62" text-anchor="middle" fill="#F3E8D0" font-family="Segoe UI, Arial" font-size="14" font-weight="700">CS Department</text><text y="82" text-anchor="middle" fill="#BDAE95" font-family="Segoe UI, Arial" font-size="12">High Honors</text></g>
  <g transform="translate(1091 143)"><circle r="36" fill="#203129" stroke="#6F9480" stroke-width="3"/><circle r="24" fill="none" stroke="#E8C47C" stroke-opacity=".4"/><circle r="7" fill="#E8C47C" filter="url(#glow)"><animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/></circle><text y="-50" text-anchor="middle" fill="#E8C47C" font-family="Georgia, serif" font-size="20" font-weight="700">300+</text><text y="66" text-anchor="middle" fill="#F3E8D0" font-family="Segoe UI, Arial" font-size="14" font-weight="700">Students</text><text y="86" text-anchor="middle" fill="#BDAE95" font-family="Segoe UI, Arial" font-size="12">Enabled</text></g>
  <rect x="1" y="1" width="1198" height="308" rx="27" stroke="url(#cord)" stroke-opacity=".55" stroke-width="2"/>
</svg>
