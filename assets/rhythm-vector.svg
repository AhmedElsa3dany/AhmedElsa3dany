<svg width="1280" height="330" viewBox="0 0 1280 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">66 GitHub contributions in the last year</title>
  <desc id="desc">An animated GitHub-style contribution calendar with a moving light wave.</desc>
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="13" height="13" rx="2.5" fill="#161B22"/></pattern>
    <linearGradient id="scan" x1="0" x2="1"><stop stop-color="#39D353" stop-opacity="0"/><stop offset=".5" stop-color="#39D353" stop-opacity=".26"/><stop offset="1" stop-color="#39D353" stop-opacity="0"/></linearGradient>
    <pattern id="paper" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#151515" opacity=".16"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="4" dy="6" stdDeviation="4" flood-color="#000" flood-opacity=".35"/></filter>
    <clipPath id="frame"><rect width="1280" height="330" rx="24"/></clipPath>
  </defs>
