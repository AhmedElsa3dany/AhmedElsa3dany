    <g transform="rotate(-2 272 52)" filter="url(#shadow)"><path d="M45 25h455l12 62-462 10Z" fill="#F2E9D8"/><text x="75" y="66" font-family="Arial Black,Arial" font-size="25" font-weight="900" fill="#151515">66 CONTRIBUTIONS / LAST YEAR</text></g>
    <g transform="rotate(3 1081 49)" filter="url(#shadow)"><rect x="1013" y="23" width="136" height="56" fill="#F6C84C"/><text x="1081" y="59" text-anchor="middle" font-family="Arial Black,Arial" font-size="21" fill="#151515">2026</text></g>
    <g font-family="Arial" font-size="13" font-weight="700" fill="#A8B3C1"><text x="130" y="118">SEP</text><text x="208" y="118">OCT</text><text x="286" y="118">NOV</text><text x="364" y="118">DEC</text><text x="442" y="118">JAN</text><text x="520" y="118">FEB</text><text x="598" y="118">MAR</text><text x="676" y="118">APR</text><text x="754" y="118">MAY</text><text x="832" y="118">JUN</text><text x="910" y="118">JUL</text><text x="988" y="118">AUG</text><text x="61" y="160">MON</text><text x="61" y="196">WED</text><text x="61" y="232">FRI</text></g>
    <rect x="130" y="133" width="936" height="126" fill="url(#grid)"/>
