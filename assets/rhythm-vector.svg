    <path d="M1133 166c34-22 72-1 63 31s-55 39-71 10 18-55 47-41" fill="none" stroke="#F6C84C" stroke-width="6" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 1160 190" to="360 1160 190" dur="12s" repeatCount="indefinite"/></path>
  </g><rect x="1.5" y="1.5" width="1277" height="327" rx="22.5" fill="none" stroke="#30363D" stroke-width="3"/>
